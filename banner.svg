<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="220">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-400,-260; 900,600; -400,-260"
        dur="3.5s"
        repeatCount="indefinite" />
    </linearGradient>

    <clipPath id="clip">
      <rect x="0" y="0" width="800" height="160" rx="8" />
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="160" rx="8" fill="#000000"/>

  <!-- animated diagonal sweep, clipped to banner -->
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="800" height="160" fill="url(#sweep)"/>
  </g>

  <!-- text -->
  <text x="400" y="92" text-anchor="middle"
        font-family="'Courier New', Consolas, monospace"
        font-size="34" fill="#ffffff" letter-spacing="2">
    Future Is Loading<tspan id="dots">...</tspan><tspan id="cursor">&#9608;</tspan>
  </text>

  <!-- blinking cursor -->
  <animate xlink:href="#cursor" attributeName="opacity"
           values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
</svg>
